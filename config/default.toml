# Reference: https://github.com/aejimmi/fail2ban-rs

[global]
state_file = "/var/lib/fail2ban-rs/state.bin"
socket_path = "/var/run/fail2ban-rs/fail2ban-rs.sock"

# Logging — stderr is captured by systemd-journald. Each line carries the
# whole payload (event phrase + structured fields). Under systemd a `<N>`
# priority prefix is added so journalctl colors and `journalctl -p err`
# work correctly.
#
# [logging]
# level = "info"      # severity filter: debug | info | warn | error
# format = "logfmt"   # default — human-readable: banned ip=1.2.3.4 jail=sshd
# format = "json"     # structured: {"msg":"banned","ip":"1.2.3.4","jail":"sshd"}

[jail.sshd]
enabled = true
log_path = "/var/log/auth.log"
date_format = "syslog"
# Keep in sync with the built-in sshd template (gen-config sshd).
filter = [
    '^\s*(?:(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d\d:\d\d:\d\d|\d{4}-\d\d-\d\dT\S+)\s+)?(?:[^:\s]+\s+)?sshd(?:-session)?(?:\[\d+\])?:\s+(?:(?:error|fatal): (?:PAM: )?)?[aA]uthentication (?:failure|error|failed) for .*? (?:from )?(?:<HOST>)(?: via \S+)?(?: (?:port \d+|on \S+|\[preauth\])){0,3}\s*$',
    '^\s*(?:(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d\d:\d\d:\d\d|\d{4}-\d\d-\d\dT\S+)\s+)?(?:[^:\s]+\s+)?sshd(?:-session)?(?:\[\d+\])?:\s+(?:(?:error|fatal): (?:PAM: )?)?User not known to the underlying authentication module for .*? (?:from )?(?:<HOST>)(?: (?:port \d+|on \S+|\[preauth\])){0,3}\s*$',
    '^\s*(?:(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d\d:\d\d:\d\d|\d{4}-\d\d-\d\dT\S+)\s+)?(?:[^:\s]+\s+)?sshd(?:-session)?(?:\[\d+\])?:\s+(?:(?:error|fatal): (?:PAM: )?)?Failed (?:\S{1,8}|\S{10,}|[^p\s]\S{8}|p[^u\s]\S{7}|pu[^b\s]\S{6}|pub[^l\s]\S{5}|publ[^i\s]\S{4}|publi[^c\s]\S{3}|public[^k\s]\S{2}|publick[^e\s]\S|publicke[^y\s]) for (?:invalid user )?[^:\r\n]+? from (?:<HOST>)(?: (?:port \d+|on \S+)){0,2}(?: ssh\d*)?(?:: [^\r\n]*|(?: \[preauth\])?)\s*$',
    '^\s*(?:(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d\d:\d\d:\d\d|\d{4}-\d\d-\d\dT\S+)\s+)?(?:[^:\s]+\s+)?sshd(?:-session)?(?:\[\d+\])?:\s+(?:(?:error|fatal): (?:PAM: )?)?Failed publickey for invalid user [^:\r\n]+? from (?:<HOST>)(?: (?:port \d+|on \S+)){0,2}(?: ssh\d*)?(?:: [^\r\n]*|(?: \[preauth\])?)\s*$',
    '^\s*(?:(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d\d:\d\d:\d\d|\d{4}-\d\d-\d\dT\S+)\s+)?(?:[^:\s]+\s+)?sshd(?:-session)?(?:\[\d+\])?:\s+(?:(?:error|fatal): (?:PAM: )?)?ROOT LOGIN REFUSED FROM (?:<HOST>)(?:\s|$)',
    '^\s*(?:(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d\d:\d\d:\d\d|\d{4}-\d\d-\d\dT\S+)\s+)?(?:[^:\s]+\s+)?sshd(?:-session)?(?:\[\d+\])?:\s+(?:(?:error|fatal): (?:PAM: )?)?[iI](?:llegal|nvalid) user .*? (?:from )?(?:<HOST>)(?: (?:port \d+|on \S+|\[preauth\])){0,3}\s*$',
    '^\s*(?:(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d\d:\d\d:\d\d|\d{4}-\d\d-\d\dT\S+)\s+)?(?:[^:\s]+\s+)?sshd(?:-session)?(?:\[\d+\])?:\s+(?:(?:error|fatal): (?:PAM: )?)?User .*? (?:from )?(?:<HOST>) not allowed because (?:not listed in AllowUsers|listed in DenyUsers|not in any group|a group is listed in DenyGroups|none of user\x27s groups are listed in AllowGroups)(?: (?:port \d+|on \S+|\[preauth\])){0,3}\s*$',
    '^\s*(?:(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d\d:\d\d:\d\d|\d{4}-\d\d-\d\dT\S+)\s+)?(?:[^:\s]+\s+)?sshd(?:-session)?(?:\[\d+\])?:\s+(?:(?:error|fatal): (?:PAM: )?)?refused connect from \S+ \((?:<HOST>)\)',
    '^\s*(?:(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d\d:\d\d:\d\d|\d{4}-\d\d-\d\dT\S+)\s+)?(?:[^:\s]+\s+)?sshd(?:-session)?(?:\[\d+\])?:\s+(?:(?:error|fatal): (?:PAM: )?)?Received disconnect from (?:<HOST>)(?: (?:port \d+|on \S+)){0,2}:\s*3: .*: Auth fail(?: (?:port \d+|on \S+|\[preauth\])){0,3}\s*$',
    '^\s*(?:(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d\d:\d\d:\d\d|\d{4}-\d\d-\d\dT\S+)\s+)?(?:[^:\s]+\s+)?sshd(?:-session)?(?:\[\d+\])?:\s+(?:(?:error|fatal): (?:PAM: )?)?maximum authentication attempts exceeded for (?:invalid user )?.*? (?:from )?(?:<HOST>)(?: (?:port \d+|on \S+)){0,2}(?: ssh\d*)?(?: (?:port \d+|on \S+|\[preauth\])){0,3}\s*$',
    '^\s*(?:(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d\d:\d\d:\d\d|\d{4}-\d\d-\d\dT\S+)\s+)?(?:[^:\s]+\s+)?sshd(?:-session)?(?:\[\d+\])?:\s+(?:(?:error|fatal): (?:PAM: )?)?Disconnecting(?: from)?(?: (?:invalid|authenticating))? user \S+ (?:<HOST>)(?: (?:port \d+|on \S+)){0,2}:\s*Change of username or service not allowed:\s*.*\[preauth\]\s*$',
]
port = ["22"]
protocol = "tcp"
max_retry = 5
find_time = "10m"
ban_time = "1h"
# Firewall backend: "nftables", "iptables", "ipset", or a script table.
# "ipset" keeps bans in a kernel hash set — O(1) lookups on long ban lists —
# and needs the ipset tool plus the ip_set, ip_set_hash_ip and xt_set modules.
backend = "nftables"

# To tune ipset, replace the backend line above with a table placed AFTER every
# other key in this jail — a TOML sub-table captures all keys that follow it:
#   [jail.sshd.backend.ipset]
#   maxelem = 65536   # max entries per set; bans past this are refused
#   chain = "INPUT"   # use "DOCKER-USER" to also cover published container ports

# Ban time escalation for repeat offenders
bantime_increment = true
bantime_multipliers = [1, 2, 4, 8, 16, 32, 64]
bantime_maxtime = "1w"

# IPs/CIDRs to never ban
ignoreip = ["127.0.0.1/8", "::1/128"]
ignoreself = true
