[package]
name = "fail2ban-rs"
version = "1.1.1"
edition = "2024"
description = "Pure-Rust drop-in replacement for Fail2Ban 1.1.1."
license = "GPL-2.0-or-later"
repository = "https://github.com/jasper-khan/fail2ban-rs"
autobins = false
autotests = false
autobenches = false

[lib]
name = "fail2ban_rs"
path = "src/f2b/lib.rs"

[[bin]]
name = "fail2ban-server"
path = "src/bin/fail2ban-server.rs"

[[bin]]
name = "fail2ban-client"
path = "src/bin/fail2ban-client.rs"

[[bin]]
name = "fail2ban-regex"
path = "src/bin/fail2ban-regex.rs"

[[bin]]
name = "apache-fakegooglebot"
path = "src/bin/apache-fakegooglebot.rs"

[[test]]
name = "f2b_parity"
path = "tests/f2b_parity.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fancy-regex = "0.14"
ipnet = "2"
memchr = "2"
nix = { version = "0.29", default-features = false, features = ["fs", "net", "process", "signal", "socket", "user"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "io-util", "net", "fs", "time", "process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rust]
unsafe_code = "warn"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
overflow-checks = true
